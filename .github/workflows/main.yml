name: Build-luci-apps

on:
  push:
    paths:
      - 'luci-app-*/**'

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
        sdk:
          - openwrt-24.10
          - master

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Detect LuCI packages
        id: packages
        shell: bash
        run: |
          set -eu

          mapfile -t packages < <(find . -maxdepth 1 -type d -name 'luci-app-*' -printf '%f\n' | sort)

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No luci-app-* packages found"
            exit 1
          fi

          package_list="${packages[*]}"

          echo "packages=$package_list" >> "$GITHUB_OUTPUT"
          echo "Detected packages: $package_list"

      - name: Get all commit messages
        id: get_commits
        shell: bash
        run: |
          set -eu

          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git log --pretty=format:'%s' ${{ github.event.before }}..${{ github.sha }} > commits.txt || true
          else
            git log -1 --pretty=format:'%s' > commits.txt || true
          fi

          if [ -f commits.txt ] && [ -s commits.txt ]; then
            printf '\n' >> commits.txt
          fi

          if [ -f commits.txt ]; then
            awk 'NF { print "- " $0 }' commits.txt > commits_md.txt || true
          fi

          DELIM="END_OF_COMMIT_MSGS_$(date +%s%N)"
          printf 'commit_msgs<<%s\n' "$DELIM" >> "$GITHUB_OUTPUT"
          cat commits_md.txt >> "$GITHUB_OUTPUT" || true
          printf '%s\n' "$DELIM" >> "$GITHUB_OUTPUT"

          echo "Found commits:"
          if [ -s commits.txt ]; then
            cat commits.txt
          else
            echo "(no commits found)"
          fi

      - name: Building packages
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: ${{ steps.packages.outputs.packages }}
          NO_REFRESH_CHECK: true
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/

      - name: Create compress files
        shell: bash
        run: |
          zip -j Luci-apps-${{ matrix.sdk }}.zip bin/packages/${{ matrix.arch }}/packages_ci/*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.date.outputs.date }}
          files: Luci-apps-${{ matrix.sdk }}.zip
          body: |

            ### 更新日志：

            ${{ steps.get_commits.outputs.commit_msgs }}

            ### 编译插件：

            `${{ steps.packages.outputs.packages }}`

            #### 注：

            - **`Luci-apps-openwrt-24.10.zip`** --> ipk 安装包
            - **`Luci-apps-master.zip`** --> apk 安装包

            - **`*.apk` 跳过证书安装命令**
            `apk add --allow-untrusted xxx.apk`
